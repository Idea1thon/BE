# 배포용. VM 1대에서 nginx + 백엔드 2개를 띄우고 DB 는 Azure 를 쓴다.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# 로컬용 docker-compose.yml 과 다른 점
#   - db 서비스가 없다. Azure PostgreSQL 을 그대로 쓴다 (이미 PostGIS·스키마 준비됨)
#   - nginx 가 앞단에서 FE 와 API 를 한 오리진으로 묶는다
#   - 값은 전부 .env 에서 온다. 기본값을 두지 않는다 — 배포에서 개발용 비밀이
#     조용히 쓰이는 것을 막는다
#
# 전제: 이 저장소가 /opt/idea1thon/BE, FE 저장소가 /opt/idea1thon/FE 에 있고
#       FE 는 `npm ci && npm run build` 로 dist/ 가 만들어져 있다.
name: idea1thon-prod

services:
  nginx:
    image: nginx:alpine
    depends_on:
      - middle-backend
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # FE 를 이미지로 굽지 않고 빌드 산출물을 마운트한다. FE 를 고칠 때마다
      # 이미지를 다시 굽는 대신 npm run build 후 nginx 만 재시작하면 된다.
      - ../FE/dist:/usr/share/nginx/html:ro
    restart: unless-stopped

  middle-backend:
    build: ./services/middle-backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT:?ENVIRONMENT 를 설정하세요}
      DATABASE_URL: ${IDEATON_ASYNC_DATABASE_URL:?Azure asyncpg 연결 문자열이 필요합니다}
      JWT_SECRET: ${JWT_SECRET:?32자 이상의 값이 필요합니다}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
      # nginx 뒤에서 같은 오리진으로 서빙하므로 브라우저는 CORS 를 태우지 않는다.
      # 값은 설정 검증을 통과시키기 위한 것이다.
      CORS_ALLOW_ORIGINS: ${PUBLIC_ORIGIN:?http://<VM 공인 IP> 형태로 설정하세요}
      RECOMMENDATION_API_URL: http://recommendation-api:8000
      SIREN_API_URL: http://siren:8000
      # 운영보고서 제출 시 Siren ID-only trigger를 실행한다. 누락되면
      # 분석이 조용히 비활성화되지 않도록 배포 자체를 실패시킨다.
      SIREN_ANALYSIS_ENABLED: ${SIREN_ANALYSIS_ENABLED:?true로 설정하세요}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?추천 API 와 같은 값이어야 합니다}
    restart: unless-stopped

  # 폐업 위험 사이렌. 포트를 열지 않고 compose 내부 네트워크에만 둔다.
  # 중간 백엔드와 동일한 내부 토큰을 사용하고, IDEATON DB는 읽기 전용 provider가
  # 조회한다.
  siren:
    build: ./services/siren
    environment:
      ENVIRONMENT: ${ENVIRONMENT:?ENVIRONMENT 를 설정하세요}
      SIREN_DATABASE_URL: ${IDEATON_DATABASE_URL:?Azure ideaton 연결 문자열이 필요합니다}
      SIREN_IDEATON_DATABASE_URL: ${IDEATON_DATABASE_URL:?Azure ideaton 연결 문자열이 필요합니다}
      SIREN_FRANCHISE_CLOSURE_TABLE: ${SIREN_FRANCHISE_CLOSURE_TABLE:-public.franchise_closure_year}
      SIREN_REVIEW_TABLE: ${SIREN_REVIEW_TABLE:-public.siren_review}
      SIREN_FRANCHISE_CLOSURE_SYNTHETIC: ${SIREN_FRANCHISE_CLOSURE_SYNTHETIC:-true}
      SIREN_INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?중간 백엔드와 같은 내부 토큰이 필요합니다}
    restart: unless-stopped

  recommendation-api:
    build: ./services/recommendation-api
    environment:
      DATABASE_URL: ${IDEATON_DATABASE_URL:?Azure ideaton 연결 문자열이 필요합니다}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?중간 백엔드와 같은 값이어야 합니다}
      RECOMMENDATION_DATA_ROOT: /data
      RECOMMENDATION_QUARTER: "20261"
      RECOMMENDATION_SOURCE: db
      RECOMMENDATION_LLM_MODE: ${RECOMMENDATION_LLM_MODE:-auto}
      RECOMMENDATION_SEED_MODE: buildings
      RECOMMENDATION_DEFAULT_LIMIT: "5"
      RECOMMENDATION_REQUEST_TIMEOUT_SECONDS: "180"
      RECOMMENDATION_READINESS_TIMEOUT_SECONDS: "3"
      RECOMMENDATION_MAX_CONCURRENT: "2"
      RECOMMENDATION_CAPACITY_RETRY_AFTER_SECONDS: "10"
      RECOMMENDATION_INCLUDE_POI: "false"
      RECOMMENDATION_INCLUDE_POI_CONTEXT: "false"
      RECOMMENDATION_INCLUDE_NEWS: "true"
      # 서빙 캐시 TTL(초). 스탬프 재확인 주기 + 엔트리 최대 수명 (PR #27).
      # 데모처럼 원천이 고정된 구간에서는 늘려서 캐시 적중을 유지한다.
      SERVING_CACHE_TTL_SECONDS: ${SERVING_CACHE_TTL_SECONDS:-300}
      RECOMMENDATION_API_OUT_ROOT: /app/output/recommendation_api_runs
      LLM_API_URL: ${LLM_API_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-20}
    volumes:
      # 준우형 원천 데이터. 없으면 서버는 뜨지만 실제 추천 요청이 실패한다.
      - ./data:/data:ro
      - recommendation-output:/app/output
    restart: unless-stopped

volumes:
  recommendation-output:
