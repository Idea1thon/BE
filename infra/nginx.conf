# 한 오리진으로 묶는다.
#
#   /            FE 정적 빌드
#   /api/        중간 백엔드
#   /docs, /openapi.json  중간 백엔드 문서 (데모 때 API 보여주기용)
#
# FE 를 별도 호스팅(HTTPS)에 두고 백엔드를 VM(HTTP)에 두면 브라우저가 mixed content
# 로 API 호출을 전부 막는다. 로컬에서는 되는데 배포하면 안 되는 대표적인 함정이라
# 처음부터 한 덩어리로 서빙한다. 같은 오리진이므로 CORS 설정도 필요 없다.

server {
    listen 80;
    server_name _;

    # 도커 내장 DNS. 아래 proxy_pass 들이 변수를 쓰므로 필요하다.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # SPA. 새로고침이나 직접 URL 접근에서 404 가 나지 않게 index.html 로 떨어뜨린다.
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # 변수를 거쳐 요청마다 DNS 를 다시 본다.
        #
        # proxy_pass 에 호스트명을 그대로 적으면 nginx 는 **기동 시 한 번만**
        # 해석하고 그 IP 를 고정한다. 백엔드 컨테이너를 재빌드하면 새 IP 를 받는데
        # nginx 는 옛 IP 를 계속 보게 된다. 배포했는데 옛 코드가 응답하거나 502 가
        # 나는 상태가 되고, 원인이 눈에 잘 안 띈다 — 실제로 한 번 겪었다.
        set $backend http://middle-backend:8000;
        proxy_pass $backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 보고서 제출은 분석 서비스를 기다릴 수 있다. 기본 60초로는 짧다.
        proxy_read_timeout 200s;
    }

    location = /openapi.json {
        set $openapi_backend http://middle-backend:8000;
        proxy_pass $openapi_backend/openapi.json;
    }
    location /docs {
        set $docs_backend http://middle-backend:8000;
        proxy_pass $docs_backend/docs;
    }
    location = /health {
        set $health_backend http://middle-backend:8000;
        proxy_pass $health_backend/health;
    }

    # 추천 API 는 서버 간 호출 전용이다. 외부에 열지 않는다 —
    # X-Internal-Token 을 브라우저에 내보내는 순간 의미가 없어진다.
}
