# 로컬 개발용. 중간 백엔드·통합 recommendation-api·DB 를 한 번에 올린다.
#
#   docker compose up --build
#
#   중간 백엔드      http://localhost:8000/docs
#   통합 recommendation-api http://localhost:8001/docs
#   PostgreSQL       localhost:55432  (ideaton)
#
# 여기 있는 값은 전부 개발용이다. Azure 접속 정보는 이 파일에 넣지 않는다 —
# .env 를 커밋했던 사고가 한 번 있었고, compose 파일은 특히 눈에 안 띈다.
name: idea1thon

services:
  db:
    # Azure 와 맞춘다: PostgreSQL 16 + PostGIS. 추천 스키마가 geometry(Point, 5181)
    # 을 쓰므로 순정 postgres 이미지로는 DDL 이 실패한다.
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpass}
      POSTGRES_DB: postgres
    ports:
      # loopback 에만 게시한다. 이 compose 는 저장소에 공개된 기본값(DB 비밀번호,
      # 시드 비밀번호, JWT secret, 내부 토큰)을 쓰므로 0.0.0.0 에 열면 같은
      # 네트워크의 누구나 그 자격 증명으로 붙을 수 있다.
      - "127.0.0.1:55432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # 초기화는 볼륨이 비어 있을 때 한 번만 돈다. DDL 을 다시 적용하려면
      # docker compose down -v 로 볼륨을 지우고 올린다.
      - ./infra/db:/docker-entrypoint-initdb.d:ro
      # 스키마 정본을 복사하지 않고 그대로 마운트한다. 사본은 갈라진다.
      - ./services/recommendation-api/db:/schema:ro
    healthcheck:
      # 초기화가 끝난 시점을 잡아야 한다. 두 가지를 조심한다.
      #
      # 1) postgres 이미지는 초기화 중 **Unix 소켓 전용 임시 서버**를 띄운다.
      #    -h 를 주지 않으면 pg_isready 가 그 임시 서버에 붙어 성공하므로,
      #    ideaton 이 아직 없는데도 healthy 가 된다. TCP 로만 본다.
      # 2) pg_isready 는 DB 존재 여부를 검사하지 않는다. 이름을 줘도 서버가
      #    살아 있으면 성공한다. 그래서 실제 질의로 스키마까지 확인한다.
      #
      # 여기서 잘못 판정하면 depends_on 이 일찍 풀려 백엔드의 alembic 단계가
      # 실패하고, 로컬에는 restart 정책이 없어 종료 상태로 남는다.
      test:
        - CMD-SHELL
        - 'pg_isready -h 127.0.0.1 -U postgres -d ideaton && PGPASSWORD=$$POSTGRES_PASSWORD psql -h 127.0.0.1 -U postgres -d ideaton -tAc "SELECT to_regclass(''location.area'') IS NOT NULL" | grep -q t'
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s

  middle-backend:
    build: ./services/middle-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      # 운영보고서와 Siren 원천을 같은 IDEATON DB에 둔다.
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-devpass}@db:5432/ideaton
      # 개발 전용 고정값. 32자 이상이어야 기동한다(app/core/config.py).
      # 운영에서는 반드시 교체한다.
      JWT_SECRET: ${JWT_SECRET:-local-development-only-not-a-real-secret-0000}
      SEED_PASSWORD: ${SEED_PASSWORD:-devpass1234}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:5173}
      # 입지 추천 연동용. 컨테이너 이름으로 부른다 — localhost 가 아니다.
      # 추천과 위험도 사이렌을 함께 제공하는 단일 recommendation-api.
      RECOMMENDATION_API_URL: http://recommendation-api:8000
      SIREN_API_URL: http://recommendation-api:8000
      # 작성 완료 제출마다 같은 recommendation-api의 Siren endpoint를 백그라운드에서
      # 부른다 — 없으면 제출은 저장되지만 분석·인앱 알림은 실행되지 않는다.
      SIREN_ANALYSIS_ENABLED: ${SIREN_ANALYSIS_ENABLED:-true}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-local-development-internal-token}
    ports:
      - "127.0.0.1:8000:8000"

  # 추천과 폐업 위험 사이렌을 한 프로세스에서 제공한다. 서비스명은 기존
  # recommendation-api를 유지하고, Siren provider는
  # IDEATON 통합 DB를 읽고, middle-backend에는 ID-only 분석 결과를 반환한다.
  recommendation-api:
    build:
      context: .
      dockerfile: services/recommendation-api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      # 동기 드라이버가 아니라 psql 서브프로세스를 쓴다. sslmode 는 로컬에 불필요.
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-devpass}@db:5432/ideaton
      SIREN_DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-devpass}@db:5432/ideaton
      SIREN_IDEATON_DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-devpass}@db:5432/ideaton
      SIREN_FRANCHISE_CLOSURE_TABLE: public.franchise_closure_year
      SIREN_REVIEW_TABLE: public.siren_review
      SIREN_FRANCHISE_CLOSURE_SYNTHETIC: "true"
      # 중간 백엔드가 X-Internal-Token 헤더로 보내는 값과 같아야 한다.
      # 추천·Siren endpoint 모두 같은 토큰을 검증한다.
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-local-development-internal-token}
      # 원천 CSV 는 저장소에 없다. 가진 사람만 아래를 채우고 볼륨을 연결한다.
      RECOMMENDATION_DATA_ROOT: ${RECOMMENDATION_DATA_ROOT:-}
      RECOMMENDATION_QUARTER: "20261"
      RECOMMENDATION_SOURCE: db
      RECOMMENDATION_LLM_MODE: auto
      RECOMMENDATION_SEED_MODE: buildings
      RECOMMENDATION_DEFAULT_LIMIT: "5"
      RECOMMENDATION_REQUEST_TIMEOUT_SECONDS: "180"
      RECOMMENDATION_READINESS_TIMEOUT_SECONDS: "3"
      RECOMMENDATION_MAX_CONCURRENT: "4"
      RECOMMENDATION_CAPACITY_RETRY_AFTER_SECONDS: "10"
      RECOMMENDATION_INCLUDE_POI: "false"
      RECOMMENDATION_INCLUDE_POI_CONTEXT: "false"
      RECOMMENDATION_INCLUDE_NEWS: "true"
      RECOMMENDATION_API_OUT_ROOT: /app/output/recommendation_api_runs
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:5173}
    ports:
      # 8000 은 중간 백엔드가 쓰므로 호스트에서는 8001 로 노출한다.
      - "127.0.0.1:8001:8000"
    volumes:
      # 실행 결과(run 아티팩트)를 컨테이너 재시작 후에도 볼 수 있게 한다.
      - recommendation-output:/app/output

volumes:
  db-data:
  recommendation-output:
