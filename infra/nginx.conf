# 한 오리진으로 묶는다.
#
#   /            FE 정적 빌드
#   /api/        중간 백엔드
#   /docs, /openapi.json  중간 백엔드 문서 (데모 때 API 보여주기용)
#
# FE 를 별도 호스팅(HTTPS)에 두고 백엔드를 VM(HTTP)에 두면 브라우저가 mixed content
# 로 API 호출을 전부 막는다. 로컬에서는 되는데 배포하면 안 되는 대표적인 함정이라
# 처음부터 한 덩어리로 서빙한다. 같은 오리진이므로 CORS 설정도 필요 없다.

server {
    listen 80;
    server_name _;

    # SPA. 새로고침이나 직접 URL 접근에서 404 가 나지 않게 index.html 로 떨어뜨린다.
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://middle-backend:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 보고서 제출은 분석 서비스를 기다릴 수 있다. 기본 60초로는 짧다.
        proxy_read_timeout 200s;
    }

    location = /openapi.json { proxy_pass http://middle-backend:8000/openapi.json; }
    location /docs           { proxy_pass http://middle-backend:8000/docs; }
    location = /health       { proxy_pass http://middle-backend:8000/health; }

    # 추천 API 는 서버 간 호출 전용이다. 외부에 열지 않는다 —
    # X-Internal-Token 을 브라우저에 내보내는 순간 의미가 없어진다.
}
