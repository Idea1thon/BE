services:
  db:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    image: ideaton-postgis-pgvector:pg16
    container_name: ideaton-db
    restart: unless-stopped
    env_file:
      - ${DOCKER_ENV_FILE:-.env.docker}
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - ideaton_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    shm_size: "1gb"

volumes:
  ideaton_pgdata:
